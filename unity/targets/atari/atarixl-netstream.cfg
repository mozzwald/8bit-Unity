# Linker config for Atari XL NetStream builds of 8bit-Unity.
#
# Derived from cc65's atarixl-largehimem.cfg. Two differences, both forced by the
# fact that the NetStream stack (netstream.s + net_proto.c + net_atari.c + the
# rewritten network.c) adds ~3.3KB that the stock map has nowhere to put:
#
#  1. DATA and BSS move into the space freed by dropping the RMT player. Under
#     NetStream, POKEY channels 3 and 4 are the stream's bit clock, so music can
#     never play; RMTPLAYER ($90E0-$9A4D) and MUSICRAM ($C000-$CBFF) are dead.
#
#     Which one goes where is not interchangeable. $C000-$CFFF is OS ROM until
#     the program banks it out, and the .xex is loaded before that happens -- a
#     load chunk aimed there writes into ROM and vanishes. So BSS takes MUSICRAM
#     (no load image; zerobss clears it from crt0, with the ROM already off) and
#     DATA, which does need loading, takes the RMT player region, which is plain
#     RAM at all times.
#
#  2. netstream-chunk.s asserts that the main chunk stops short of BITMAPRAM2-8
#     ($7008). The stock config lets MAIN run to $CBFF and the linker fills it,
#     straight over the bitmap frame 2 buffer at $7010. Nothing catches that: the
#     link succeeds and the Atari hangs on its first LoadBitmap(), because
#     decrunching the bitmap overwrites the program's own code. MAIN keeps its
#     stock size here -- crt0 derives the C stack from the top of MAIN, so
#     shrinking the area moves the stack down on top of the program -- and the
#     assert provides the bound instead.
#
# See unity/targets/atari/platform.h for the memory map these addresses come from.

FEATURES {
    STARTADDRESS: default = $2400;
}
SYMBOLS {
    __EXEHDR__:       type = import;
    __SYSTEM_CHECK__: type = import;                # force inclusion of "system check" load chunk
    __AUTOSTART__:    type = import;                # force inclusion of autostart "trailer"
    __NETCHUNK__:     type = import;                # force inclusion of the $7008 bound check
    __STACKSIZE__:    type = weak,   value = $0800; # 2k stack
    __CHARGENSIZE__:  type = weak,   value = $0400;
    __STARTADDRESS__: type = export, value = %S;
    __BITMAPRAM2__:   type = weak,   value = $7010; # platform.h: bitmap frame 2, $7010-$8F4F
    __RMTPLAYER__:    type = weak,   value = $8F50; # first byte past bitmap frame 2
    __MUSICRAM__:     type = weak,   value = $C000;
    __PMGPLAYER0__:   type = weak,   value = $9C00; # PMBASE $9800 + $400, first player
}
MEMORY {
    ZP:         file = "", define = yes, start = $0082,                   size = $007E;

# just $FFFF
    HEADER:     file = %O,               start = $0000,                   size = $0002;

# "system check" load chunk
    SYSCHKHDR:  file = %O,               start = $0000,                   size = $0004;
    SYSCHKCHNK: file = %O,               start = $2E00,                   size = $0300;
    SYSCHKTRL:  file = %O,               start = $0000,                   size = $0006;

# "shadow RAM preparation" load chunk
    SRPREPHDR:  file = %O,               start = $0000,                   size = $0004;
    SRPREPCHNK: file = %O, define = yes, start = %S,                      size = $7C20 - %S - $07FF;  # $07FF: space for temp. chargen buffer, 1K aligned
    SRPREPTRL:  file = %O,               start = $0000,                   size = $0006;

# BSS, in the RAM the RMT player used to occupy, running up to the first player.
#
# That includes the missile page at $9B00-$9BFF, which ANTIC does DMA -- but
# Slicks never writes it: SetSprite only touches PMGRAM ($9C00) upwards and
# LoadSprites' bzero clears only the four player pages. So it already displays
# whatever the loader left there, invisibly, because HPOSM is parked off-screen
# and nothing ever moves it. Using it for BSS changes nothing observable.
    NETBSS:     file = "", define = yes, start = __RMTPLAYER__,           size = __PMGPLAYER0__ - __RMTPLAYER__;

# "main program" load chunk
    MAINHDR:    file = %O,               start = $0000,                   size = $0004;
    MAIN:       file = %O, define = yes, start = %S + __LOWBSS_SIZE__,    size = $D000 - __STACKSIZE__ - %S - __LOWBSS_SIZE__;

# defines entry point into program
    TRAILER:    file = %O,               start = $0000,                   size = $0006;

# address of relocated character generator
    CHARGEN:    file = "", define = yes, start = $D800,                   size = __CHARGENSIZE__;

# memory beneath the ROM
    HIDDEN_RAM: file = "", define = yes, start = $D800 + __CHARGENSIZE__, size = $FFFA - $D800 - __CHARGENSIZE__;
}
SEGMENTS {
    ZEROPAGE:    load = ZP,                           type = zp;
    EXTZP:       load = ZP,                           type = zp,                optional = yes;

    EXEHDR:      load = HEADER,                       type = ro;

    SYSCHKHDR:   load = SYSCHKHDR,                    type = ro,                optional = yes;
    SYSCHK:      load = SYSCHKCHNK,                   type = rw,  define = yes, optional = yes;
    SYSCHKTRL:   load = SYSCHKTRL,                    type = ro,                optional = yes;

    SRPREPHDR:   load = SRPREPHDR,                    type = ro;
    LOWBSS:      load = SRPREPCHNK,                   type = bss, define = yes;  # shared btw. SRPREPCHNK and MAIN, not zero initialized
    SRPREP:      load = SRPREPCHNK,                   type = rw,  define = yes;
    SHADOW_RAM:  load = SRPREPCHNK, run = HIDDEN_RAM, type = rw,  define = yes, optional = yes;
    SHADOW_RAM2: load = SRPREPCHNK, run = HIDDEN_RAM, type = rw,  define = yes, optional = yes;
    SRPREPTRL:   load = SRPREPTRL,                    type = ro;

    MAINHDR:     load = MAINHDR,                      type = ro;
    STARTUP:     load = MAIN,                         type = ro,  define = yes;
    LOWCODE:     load = MAIN,                         type = ro,  define = yes, optional = yes;
    ONCE:        load = MAIN,                         type = ro,                optional = yes;
    CODE:        load = MAIN,                         type = ro,  define = yes;
    RODATA:      load = MAIN,                         type = ro;
    DATA:        load = MAIN,                         type = rw;
    NETBSS2:     load = MAIN,                         type = bss, define = yes, optional = yes;  # BSS that NETBSS cannot hold
    INIT:        load = MAIN,                         type = bss, define = yes, optional = yes;
    BSS:         load = NETBSS,                       type = bss, define = yes;
    AUTOSTRT:    load = TRAILER,                      type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
